<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <!-- Large outer ring -->
  <circle cx="300" cy="300" r="280" stroke="rgba(167,139,250,0.15)" stroke-width="1.5"/>
  <!-- Medium ring -->
  <circle cx="300" cy="300" r="220" stroke="rgba(167,139,250,0.10)" stroke-width="1"/>
  <!-- Inner ring -->
  <circle cx="300" cy="300" r="160" stroke="rgba(196,181,253,0.12)" stroke-width="1"/>
  <!-- Arc top-right -->
  <path d="M 450 120 A 180 180 0 0 1 540 300" stroke="rgba(167,139,250,0.20)" stroke-width="2" stroke-linecap="round"/>
  <!-- Arc bottom-left -->
  <path d="M 150 480 A 180 180 0 0 1 60 300" stroke="rgba(167,139,250,0.15)" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Small accent circle top-left -->
  <circle cx="80" cy="100" r="40" stroke="rgba(196,181,253,0.18)" stroke-width="1"/>
  <!-- Small accent circle bottom-right -->
  <circle cx="520" cy="500" r="55" stroke="rgba(167,139,250,0.13)" stroke-width="1"/>
  <!-- Dot cluster top-right area -->
  <circle cx="480" cy="80" r="4" fill="rgba(196,181,253,0.30)"/>
  <circle cx="500" cy="100" r="2.5" fill="rgba(167,139,250,0.25)"/>
  <circle cx="460" cy="108" r="2" fill="rgba(196,181,253,0.20)"/>
  <!-- Dot cluster bottom-left area -->
  <circle cx="110" cy="490" r="3.5" fill="rgba(196,181,253,0.25)"/>
  <circle cx="90" cy="510" r="2" fill="rgba(167,139,250,0.20)"/>
  <!-- Center subtle glow disc -->
  <circle cx="300" cy="300" r="90" fill="rgba(124,58,237,0.06)"/>
</svg>
