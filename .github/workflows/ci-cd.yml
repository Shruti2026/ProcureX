# =============================================================================
# ProcureX — CI / CD Pipeline
# =============================================================================
# Runs on every push and pull request to both the azure and master branches.
#
# Jobs:
#   backend-ci  — compile all modules and run the full test suite
#   frontend-ci — install dependencies and run a production Vite build
#   deploy      — deploy to Azure VM (push to azure or master only, skipped on PRs)
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   VM_HOST    — VM public IP or DNS (e.g. 20.40.50.207)
#   VM_USER    — SSH username (e.g. azureuser)
#   VM_SSH_KEY — Full contents of the private SSH key (~/.ssh/id_rsa)
#
# The .env.production file lives only on the VM and is never touched here.
#
# VITE_API_BASE_URL in .env.production must be the bare VM origin with NO
# /api suffix (e.g. http://20.40.50.207). The service files already prefix
# every request path with /api/v1/... so adding /api here causes doubled
# paths like /api/api/v1/... and 404 errors.
# =============================================================================

name: CI / CD

on:
  push:
    branches:
      - azure
      - master
  pull_request:
    branches:
      - azure
      - master

env:
  DEPLOY_PATH: /opt/procurex

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Backend — compile + test
  # ---------------------------------------------------------------------------
  backend-ci:
    name: Backend — Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Compile and run tests
        run: mvn clean verify --no-transfer-progress
        working-directory: backend

      - name: Upload built JARs as artifact
        uses: actions/upload-artifact@v6
        with:
          name: backend-jars
          path: |
            backend/*/target/*.jar
            !backend/*/target/*-sources.jar
            !backend/*/target/original-*.jar
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Job 2: Frontend — install + production build
  # ---------------------------------------------------------------------------
  frontend-ci:
    name: Frontend — Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Vite production build
        # Use a placeholder origin — no /api suffix.
        # authService paths already include /api/v1/... so the base URL
        # must be the bare origin only.
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://placeholder-ci-build

