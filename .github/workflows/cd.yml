# =============================================================================
# ProcureX — CD: Deploy to Azure VM
# =============================================================================
# Runs only after the CI workflow completes successfully on the azure branch.
# Never triggers on pull requests — only merged, passing code gets deployed.
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   VM_HOST        — VM public IP or DNS (e.g. 20.40.50.207)
#   VM_USER        — SSH username (e.g. azureuser)
#   VM_SSH_KEY     — Full contents of the private SSH key (~/.ssh/id_rsa)
#
# The .env.production file lives only on the VM and is never touched by this
# pipeline — secrets never pass through GitHub.
#
# VITE_API_BASE_URL in .env.production must be the bare VM origin with NO
# /api suffix (e.g. http://20.40.50.207). The service files already prefix
# every request path with /api/v1/... so adding /api here causes doubled
# paths like /api/api/v1/... and 404 errors.
# =============================================================================

name: CD

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - azure
    types:
      - completed

env:
  DEPLOY_PATH: /opt/procurex

jobs:
  deploy:
    name: Deploy to Azure VM
    runs-on: ubuntu-latest
    # Only deploy when CI actually passed — not on failure or cancellation
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download built JARs from CI
        uses: actions/download-artifact@v4
        with:
          name: backend-jars
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: backend

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Ensure deploy directory exists on VM
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
            "sudo mkdir -p ${{ env.DEPLOY_PATH }} && sudo chown ${{ secrets.VM_USER }}:${{ secrets.VM_USER }} ${{ env.DEPLOY_PATH }}"

      - name: Copy project files to VM
        # --delete removes files on the VM that were deleted in the repo.
        # Exclusions keep node_modules, .git, and secrets untouched on the VM.
        run: |
          rsync -avz --delete \
            --exclude '.git' \
            --exclude 'frontend/node_modules' \
            --exclude '.env.production' \
            --exclude '*.log' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:${{ env.DEPLOY_PATH }}/

      - name: Build images & restart containers on VM
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
            'bash -s' << 'REMOTE_SCRIPT'
          set -e

          # Find docker regardless of install method (apt, snap, custom)
          DOCKER_BIN=$(command -v docker || \
                       ls /snap/bin/docker /usr/bin/docker /usr/local/bin/docker 2>/dev/null | head -1)
          if [ -z "$DOCKER_BIN" ]; then
            echo "ERROR: docker not found on VM. Please install Docker first."
            exit 1
          fi
          echo "Using docker at: $DOCKER_BIN"
          "$DOCKER_BIN" --version

          cd /opt/procurex

          echo ">>> Pulling latest base images..."
          "$DOCKER_BIN" compose -f docker-compose.prod.yml --env-file .env.production pull mysql rabbitmq

          echo ">>> Rebuilding and restarting all services..."
          "$DOCKER_BIN" compose -f docker-compose.prod.yml --env-file .env.production \
            up -d --build --remove-orphans

          echo ">>> Waiting for gateway health check (up to 5 min)..."
          HEALTHY=false
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1; then
              echo "API Gateway is healthy."
              HEALTHY=true
              break
            fi
            echo "Attempt $i/30 — waiting 10s..."
            sleep 10
          done

          if [ "$HEALTHY" = false ]; then
            echo "ERROR: API Gateway did not become healthy within 5 minutes."
            "$DOCKER_BIN" compose -f docker-compose.prod.yml logs --tail=50 api-gateway
            exit 1
          fi

          echo ">>> Cleaning up unused images..."
          "$DOCKER_BIN" image prune -f

          echo ">>> Deployment complete."
          "$DOCKER_BIN" compose -f docker-compose.prod.yml ps
          REMOTE_SCRIPT

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
