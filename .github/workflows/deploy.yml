# =============================================================================
# ProcureX — CI/CD: Build & Deploy to Azure VM
# =============================================================================
# Triggers on every push to main.
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   VM_HOST        — VM public IP or DNS (e.g. procurex.eastus.cloudapp.azure.com)
#   VM_USER        — SSH username (e.g. azureuser)
#   VM_SSH_KEY     — Private SSH key contents (the full text of ~/.ssh/id_rsa)
#
# The .env.production file lives only on the VM and is never touched by this
# pipeline — secrets never pass through GitHub.
# =============================================================================

name: Deploy to Azure VM

on:
  push:
    branches:
      - azure
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

env:
  DEPLOY_PATH: /opt/procurex

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Build — compile all JARs and cache them as artifacts
  # ---------------------------------------------------------------------------
  build:
    name: Build Backend JARs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Build all backend JARs (skip tests)
        run: mvn clean package -DskipTests --no-transfer-progress
        working-directory: backend

      - name: Upload built JARs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jars
          # Upload each service's target/ directory so the VM can use them
          path: |
            backend/*/target/*.jar
            !backend/*/target/*-sources.jar
            !backend/*/target/original-*.jar
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Job 2: Deploy — SSH into VM, pull code, copy JARs, rebuild & restart
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Azure VM
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download built JARs
        uses: actions/download-artifact@v4
        with:
          name: backend-jars
          # Restores to the same relative paths: backend/*/target/*.jar
          path: .

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Ensure deploy directory exists on VM
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
            "sudo mkdir -p ${{ env.DEPLOY_PATH }} && sudo chown ${{ secrets.VM_USER }}:${{ secrets.VM_USER }} ${{ env.DEPLOY_PATH }}"

      - name: Copy project files to VM
        # rsync the full repo (including pre-built JARs) to the VM.
        # --delete removes files on the VM that were deleted in the repo.
        # Exclusions keep node_modules, .git, and secrets untouched on the VM.
        run: |
          rsync -avz --delete \
            --exclude '.git' \
            --exclude 'frontend/node_modules' \
            --exclude '.env.production' \
            --exclude '*.log' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:${{ env.DEPLOY_PATH }}/

      - name: Build images & restart containers on VM
        # Pipe a script over SSH instead of passing inline commands.
        # This avoids quoting/escaping issues and runs in a proper login shell.
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
            'bash -s' << 'REMOTE_SCRIPT'
          set -e

          # Find docker regardless of install method (apt, snap, custom)
          DOCKER_BIN=$(command -v docker || \
                       ls /snap/bin/docker /usr/bin/docker /usr/local/bin/docker 2>/dev/null | head -1)
          if [ -z "$DOCKER_BIN" ]; then
            echo "ERROR: docker not found on VM. Please install Docker first."
            exit 1
          fi
          echo "Using docker at: $DOCKER_BIN"
          "$DOCKER_BIN" --version

          cd /opt/procurex

          echo ">>> Pulling latest base images..."
          "$DOCKER_BIN" compose -f docker-compose.prod.yml --env-file .env.production pull mysql rabbitmq

          echo ">>> Rebuilding and restarting all services..."
          "$DOCKER_BIN" compose -f docker-compose.prod.yml --env-file .env.production \
            up -d --build --remove-orphans

          echo ">>> Waiting for gateway health check (up to 5 min)..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1; then
              echo "API Gateway is healthy."
              break
            fi
            echo "Attempt $i/30 — waiting 10s..."
            sleep 10
          done

          echo ">>> Cleaning up unused images..."
          "$DOCKER_BIN" image prune -f

          echo ">>> Deployment complete."
          "$DOCKER_BIN" compose -f docker-compose.prod.yml ps
          REMOTE_SCRIPT

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
