# Development docker-compose override
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
# This enables hot-reload via Spring Boot DevTools when source code changes.
# After making code changes, run: docker-compose exec <service> mvn compile -pl <service> -am
# Or simply restart the container: docker-compose restart <service>

services:

  eureka-server:
    build:
      context: .
      dockerfile: ./eureka-server/Dockerfile.dev
    volumes:
      - ./eureka-server/src:/app/eureka-server/src
      - maven_repo:/root/.m2

  identity-service:
    build:
      context: .
      dockerfile: ./identity-service/Dockerfile.dev
    volumes:
      - ./identity-service/src:/app/identity-service/src
      - maven_repo:/root/.m2

