<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Purchase Order Approved</title></head>
<body style="font-family: Arial, sans-serif; color: #333; max-width: 600px; margin: 0 auto;">
  <div style="background: #1e40af; padding: 24px; text-align: center;">
    <h1 style="color: white; margin: 0; font-size: 20px;">ProcureX</h1>
  </div>
  <div style="padding: 32px 24px;">
    <h2 style="color: #1e40af;">Purchase Order Approved</h2>
    <p>Hello <strong th:text="${vendorName}">Vendor Name</strong>,</p>
    <p>A Purchase Order has been approved and issued to your company.</p>
    <table style="width: 100%; border-collapse: collapse; margin: 16px 0;">
      <tr>
        <td style="padding: 8px; color: #666;">PO Number</td>
        <td style="padding: 8px; font-weight: bold;" th:text="${poNumber}">PO-2026-00001</td>
      </tr>
      <tr style="background: #f9fafb;">
        <td style="padding: 8px; color: #666;">Total Amount</td>
        <td style="padding: 8px; font-weight: bold;" th:text="${totalAmount}">10000.00</td>
      </tr>
      <tr>
        <td style="padding: 8px; color: #666;">Expected Delivery</td>
        <td style="padding: 8px;" th:text="${expectedDelivery}">2026-12-15</td>
      </tr>
    </table>
    <div style="text-align: center; margin: 32px 0;">
      <a th:href="${portalUrl}" href="#"
         style="background: #1e40af; color: white; padding: 12px 28px; text-decoration: none; border-radius: 6px; font-weight: bold;">
        View Purchase Order
      </a>
    </div>
  </div>
</body>
</html>
