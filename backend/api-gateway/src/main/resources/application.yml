server:
  port: 8080

cors:
  # Comma-separated list of allowed origins.
  # Override with CORS_ALLOWED_ORIGINS env var in production (e.g. "http://your-vm-domain.com").
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

jwt:
  secret: ${JWT_SECRET:404D6351665468576D5A7134743777217A25432A462D4A614E645267556B5870}

spring:
  application:
    name: procurex-api-gateway
  main:
    web-application-type: reactive
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity-service-auth
              uri: lb://procurex-identity-service
              predicates:
                - Path=/api/v1/auth/**
            - id: identity-service-admin
              uri: lb://procurex-identity-service
              predicates:
                - Path=/api/v1/admin/**
            - id: vendor-catalog-service
              uri: lb://procurex-vendor-catalog-service
              predicates:
                - Path=/api/v1/vendors/**, /api/v1/products/**, /api/v1/categories/**
            - id: vendor-products-route
              uri: lb://procurex-vendor-catalog-service
              predicates:
                - Path=/api/v1/vendor-products/**
            - id: procurement-service
              uri: lb://procurex-procurement-service
              predicates:
                - Path=/api/v1/procurement/**
            - id: inventory-service
              uri: lb://procurex-inventory-service
              predicates:
                - Path=/api/v1/inventory/**
            - id: finance-service
              uri: lb://procurex-finance-service
              predicates:
                - Path=/api/v1/finance/**
              filters:
                - RewritePath=/api/v1/finance/(?<segment>.*), /api/v1/finance/${segment}
            - id: notification-service
              uri: lb://procurex-notification-service
              predicates:
                - Path=/api/v1/notifications/**
              filters:
                - RewritePath=/api/v1/notifications/(?<segment>.*), /api/v1/notifications/${segment}
            - id: analytics-service
              uri: lb://procurex-analytics-service
              predicates:
                - Path=/api/v1/reports/**
              filters:
                - RewritePath=/api/v1/reports/(?<segment>.*), /api/v1/reports/${segment}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.springframework.cloud.gateway: WARN
    org.springframework.cloud.loadbalancer: WARN
    reactor.netty.http.client: WARN